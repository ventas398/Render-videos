name: render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id"
        default: "SHORT-08"
      chunks:
        description: "Parallel parts (vacio = automatico)"
        default: ""
  # Empujar una etiqueta render-<COMP> lanza el render sin tocar el navegador.
  # Ejemplo: git tag render-SHORT-08 && git push origin render-SHORT-08
  push:
    tags:
      - "render-*"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      total: ${{ steps.p.outputs.total }}
      comp: ${{ steps.p.outputs.comp }}
      bundle: ${{ steps.b.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Sistema (chrome libs + fuentes)
        run: |
          # El indice de paquetes de la imagen suele servir: 'apt-get update' solo si falla.
          LIBS="libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0 fontconfig"
          sudo apt-get install -y -qq --no-install-recommends $LIBS \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $LIBS; }
      - id: b
        name: Compilar el proyecto UNA vez (lo reutilizan todas las maquinas)
        run: |
          set +e
          npx remotion bundle src/index.ts --out-dir=bundle > bundle.log 2>&1
          tail -5 bundle.log
          set -e
          if [ -f bundle/index.html ]; then
            echo "bundle=si" >> "$GITHUB_OUTPUT"
            echo "::notice::bundle ok ($(du -sh bundle | cut -f1))"
          else
            echo "bundle=no" >> "$GITHUB_OUTPUT"
            echo "::notice::sin bundle, cada maquina compila :: $(tr '\n' ' ' < bundle.log | tail -c 300)"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.b.outputs.bundle == 'si'
        with:
          name: bundle
          path: bundle
          retention-days: 1
      - id: p
        name: Duracion y reparto en partes
        run: |
          COMP="${{ inputs.composition }}"
          test -n "$COMP" || COMP="${GITHUB_REF_NAME#render-}"
          COMP="${COMP%%--*}"   # render-SHORT-08--2 = segundo intento de SHORT-08
          N="${{ inputs.chunks }}"
          TARGET=src/index.ts
          [ -f bundle/index.html ] && TARGET=bundle
          echo "composicion=$COMP partes=${N:-automatico} desde=$TARGET"
          set +e
          npx remotion compositions "$TARGET" > comps.txt 2>&1
          RC=$?
          set -e
          cat comps.txt
          TOTAL=$(awk -v id="$COMP" '$1==id {print $4}' comps.txt)
          if [ -z "$TOTAL" ]; then
            # Los registros de un repo publico piden sesion; una anotacion se lee sin ella.
            echo "::error::plan rc=$RC comp=$COMP :: $(tr '\n' ' ' < comps.txt | head -c 500) ... $(tr '\n' ' ' < comps.txt | tail -c 300)"
            exit 1
          fi
          echo "comp=$COMP" >> "$GITHUB_OUTPUT"
          node -e '
            const total=+process.argv[1];
            // Sin numero de partes: unos 300 fotogramas por maquina, tope 20 (limite del plan gratis).
            let n=+process.argv[2];
            if(!Number.isFinite(n)||n<1) n=Math.min(20,Math.max(1,Math.ceil(total/300)));
            const size=Math.ceil(total/n); const m=[];
            for(let i=0;i<n;i++){const a=i*size,b=Math.min(total-1,a+size-1); if(a<=b) m.push({i,a,b});}
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"matrix="+JSON.stringify({include:m})+"\ntotal="+total+"\n");
            console.log("::notice::plan ok: "+process.argv[3]+" "+total+" fotogramas en "+m.length+" partes");
          ' "$TOTAL" "$N" "$COMP"

  part:
    needs: plan
    runs-on: ubuntu-latest
    env:
      COMP: ${{ needs.plan.outputs.comp }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Sistema (chrome libs + fuentes)
        run: |
          LIBS="libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0 fontconfig"
          sudo apt-get install -y -qq --no-install-recommends $LIBS \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $LIBS; }
          # Impact no existe en Linux: Anton (licencia OFL) hace de sustituta
          mkdir -p ~/.fonts ~/.config/fontconfig
          curl -fsSL -o ~/.fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true
          printf '<?xml version="1.0"?><fontconfig><alias binding="same"><family>Impact</family><prefer><family>Anton</family></prefer></alias></fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f
      # El proyecto ya viene compilado desde 'plan': esta maquina no vuelve a compilarlo.
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.bundle == 'si'
        with: { name: bundle, path: bundle }
      - name: Render parte ${{ matrix.i }} (frames ${{ matrix.a }}-${{ matrix.b }})
        run: |
          START=$(date +%s)
          TARGET=src/index.ts
          [ -f bundle/index.html ] && TARGET=bundle
          set +e
          npx remotion render "$TARGET" "$COMP" out/part-${{ matrix.i }}.mp4 --frames=${{ matrix.a }}-${{ matrix.b }} --muted --codec=h264 > r.log 2>&1
          RC=$?
          set -e
          tail -40 r.log
          # Los registros de un repo publico piden sesion; una anotacion se lee sin ella.
          if [ $RC -ne 0 ]; then
            echo "::error::parte ${{ matrix.i }} rc=$RC :: $(tr '\n' ' ' < r.log | tail -c 900)"
            exit 1
          fi
          echo "parte ${{ matrix.i }} ($TARGET): $(( $(date +%s) - START )) s"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.i }}
          path: out/part-${{ matrix.i }}.mp4
          retention-days: 1

  join:
    needs: [plan, part]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMP: ${{ needs.plan.outputs.comp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: parts, merge-multiple: true }
      - name: ffmpeg (no viene en la imagen ubuntu-24.04)
        run: sudo apt-get install -y -qq ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - name: Unir partes y poner el audio
        run: |
          set +e
          {
            ls -l parts
            for f in $(ls parts/part-*.mp4 | sort -V); do echo "file '$PWD/$f'"; done > list.txt
            cat list.txt
            ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy video.mp4 || exit 1
            # El .m4a ya viene en aac (lo prepara scripts/sync_assets.mjs): se pega sin recodificar.
            A="public/audio/$COMP.m4a"; AC="copy"
            [ -f "$A" ] || { A="public/audio/$COMP.wav"; AC="aac"; }
            ffmpeg -y -v error -i video.mp4 -i "$A" -map 0:v -map 1:a -c:v copy -c:a "$AC" -shortest "$COMP.mp4" || exit 1
            ffprobe -v error -show_entries format=duration:stream=codec_name -of default=nw=1 "$COMP.mp4" || exit 1
          } > join.log 2>&1
          RC=$?
          cat join.log
          if [ $RC -ne 0 ]; then
            echo "::error::join rc=$RC :: $(tr '\n' ' ' < join.log | tail -c 700)"
            exit 1
          fi
          echo "::notice::join ok: $COMP.mp4 $(tr '\n' ' ' < join.log | tail -c 200)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.comp }}
          path: ${{ needs.plan.outputs.comp }}.mp4
          retention-days: 7
      # Un artefacto pide sesion para bajarlo; un fichero de Release se baja sin sesion.
      - name: Publicar el MP4 como descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-$COMP-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$COMP.mp4" --title "$COMP" --notes "Render automatico de $COMP" >/dev/null
          URL=$(gh release view "$TAG" --json assets --jq '.assets[0].url')
          echo "::notice::descarga: $URL"
